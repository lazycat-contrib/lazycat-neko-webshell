name: Publish Neko LPK
on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: WebShell source tag (defaults to the latest stable vX.Y.Z)
        type: string
      dry-run:
        description: Verify only; skip Release and store submissions
        type: boolean
        default: true
  schedule:
    - cron: '9,39 * * * *'
permissions:
  contents: read
concurrency:
  group: neko-source-release
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      asset: ${{ steps.source.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: source
        uses: actions/github-script@v9
        env:
          SOURCE_TAG: ${{ inputs.source-tag }}
        with:
          script: |
            await require('./scripts/neko-source.cjs').select({github, context, core});
  build:
    needs: select
    if: needs.select.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.select.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        if: "!needs.select.outputs.asset"
        with:
          repository: ca-x/lazycat-neko-webshell
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - name: Verify source version
        if: "!needs.select.outputs.asset"
        run: |
          test "$(awk '/^version:/ {print $2; exit}' package.yml)" = "$VERSION"
          node scripts/check-version-consistency.mjs
      - uses: actions/setup-node@v7
        if: "!needs.select.outputs.asset"
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@v1
        if: "!needs.select.outputs.asset"
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        if: "!needs.select.outputs.asset"
      - name: Install native build dependencies
        if: "!needs.select.outputs.asset"
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build LPK from source
        if: "!needs.select.outputs.asset"
        id: build
        uses: ca-x/lazycat-github-action@v1.3.6
        env:
          LAZYCAT_WORKFLOW_TOOLCHAINS: node,rust
          LAZYCAT_WORKFLOW_NODE_VERSION: 24.x
          LAZYCAT_WORKFLOW_RUST_TOOLCHAIN: 1.97.1
        with:
          operation: build
          config: .github/lazycat-action.yml
          version: ${{ env.VERSION }}
      - name: Recover exact Release asset for a retry
        if: needs.select.outputs.asset
        env:
          ASSET: ${{ needs.select.outputs.asset }}
          GH_TOKEN: ${{ github.token }}
        run: gh api -H 'Accept:application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" > recovery.lpk
      - uses: actions/upload-artifact@v7
        with:
          name: neko-lpk-v${{ env.VERSION }}
          path: ${{ steps.build.outputs.lpk-path || 'recovery.lpk' }}
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [select, build]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-lpk.yml
    with:
      component: neko
      built-version: ${{ needs.select.outputs.version }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
