name: Check neoko-terminal publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*neoko-terminal*.yml'
      - 'components/neoko-terminal/**'
      - 'scripts/*neoko*'
  pull_request:
    paths:
      - '.github/workflows/*neoko-terminal*.yml'
      - 'components/neoko-terminal/**'
      - 'scripts/*neoko*'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify native provenance, ZIP boundaries and source/publication guards
        run: |
          python3 -m unittest discover -s scripts -p 'test_neoko_terminal*.py'
          node --test scripts/neoko-terminal.test.cjs scripts/neoko-terminal-desktop.test.cjs
      - name: Validate independent native workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*neoko-terminal*.yml
