name: Check Cloudflare Relay
on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/check-relay.yml']
  pull_request:
    paths: ['relay/**', '.github/workflows/check-relay.yml']
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Verify Relay and Cloudflare bundle
        working-directory: relay
        run: |
          npm ci
          npm test
          npm run test:integration
          npm run check
