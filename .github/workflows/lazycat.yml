name: Build and publish LazyCat application

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/lazycat-action.yml
      - .github/workflows/lazycat.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - build.rs
      - package-lock.json
      - package.json
      - proto/**
      - resources/**
      - scripts/**
      - src/**
      - vendor/restty/**
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-source:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Run source build
        run: scripts/build-release.sh

      - name: Build and validate LPK
        id: lazycat
        uses: ca-x/lazycat-github-action@v1
        env:
          LAZYCAT_WORKFLOW_TOOLCHAINS: node,rust
          LAZYCAT_WORKFLOW_NODE_VERSION: 24.x
          LAZYCAT_WORKFLOW_RUST_TOOLCHAIN: 1.97.1
        with:
          operation: build
          config: .github/lazycat-action.yml

      - name: Upload validation Artifact
        uses: actions/upload-artifact@v7
        with:
          name: neko-webshell-lpk
          path: ${{ steps.lazycat.outputs.lpk-path }}
          if-no-files-found: error

  publish-tag:
    if: github.ref_type == 'tag'
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      versioned-release-asset: true
      toolchains: node,rust
      node-version: 24.x
      rust-toolchain: 1.97.1
    secrets:
      LAZYCAT_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
