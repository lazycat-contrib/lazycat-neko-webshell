name: Check native client publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*remoted-client.yml'
      - 'components/remoted-client/**'
      - 'scripts/*remoted*'
  pull_request:
    paths:
      - '.github/workflows/*remoted-client.yml'
      - 'components/remoted-client/**'
      - 'scripts/*remoted*'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify native provenance, ZIP boundaries and source/publication guards
        run: |
          python3 -m unittest discover -s scripts -p 'test_remoted_native.py'
          node --test scripts/remoted-client.test.cjs
      - name: Validate independent native workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*remoted-client.yml
