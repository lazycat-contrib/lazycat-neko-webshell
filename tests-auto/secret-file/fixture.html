<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>机密文件交互验证</title><style>body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}header{display:flex;align-items:center;justify-content:space-between}#terminal-input{font:14px/1.8 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:44px}#mobile-host{position:fixed;bottom:0;left:0;right:0}#notice{color:var(--muted);font-size:13px}h1{font-size:16px}</style></head><body><header><h1>WebShell · workspace</h1><button id="open" class="command-button">打开面板（测试）</button></header><p id="notice">交互测试环境 · 所有凭据和文件操作均为模拟</p><div id="terminal-input">› </div><div id="terminal-mount" style="height:180px;margin-top:16px"></div><div id="mobile-host"></div><script type="module">
import '/src/styles.css';
import '/src/mobile/styles.css';
import {createIcons,icons} from 'lucide';
import {createSecretFileController} from '/src/secret-file/controller.ts';
import {createTerminalPaneMount} from '/src/pane-dom.ts';
import {forwardPaneContextMenuToRestty,interceptTerminalContextMenuPointer} from '/src/restty-context-menu.ts';
import {createPaneTerminal} from '/src/terminal-options.ts';
import {nativePaneContextMenuItems} from '/src/pane-menu-actions.ts';
import {renderMobileKeyboardView} from '/src/mobile/keyboard-view.ts';
import {createMobileKeyboardController} from '/src/mobile/keyboard-controller.ts';
import {translate} from '/src/i18n.ts';
window.qa={generation:1,mode:'ok',clipboard:'  TEST-ONLY KEY\nsecond line\n',requests:[],pastes:[],pendingReads:[],delay:0,restoredKeyboard:0,shortcut:'alt-v'};
qa.pane={id:'p',sessionId:'s',selector:'workspace@owner',connectionState:'connected',replaying:false,closing:false,exited:false};
Object.defineProperty(navigator,'clipboard',{configurable:true,value:{readText:()=>qa.mode==='deny'?Promise.reject(new Error('denied')):qa.mode==='pending'?new Promise(resolve=>qa.pendingReads.push(resolve)):Promise.resolve(qa.mode==='empty'?'':qa.clipboard),writeText:async text=>{if(qa.copyFail)throw new Error('denied');qa.copied=text;}}});
const originalFetch = window.fetch.bind(window);
window.fetch = async (url, init) => {
 const parsed = new URL(url, location.href);
 if(parsed.pathname !== '/api/secret-files') return originalFetch(url, init);
 const body = init.method === 'DELETE' ? JSON.parse(init.body) : undefined;
 const request = {operation:init.method==='POST'?'secret_create':'secret_delete',sessionId:body?.sessionId??parsed.searchParams.get('sessionId'),metadata:{selector:body?.selector??parsed.searchParams.get('selector'),path:body?.path},payload:init.method==='POST'?Array.from(init.body):[]};
 qa.requests.push(request);
 if(qa.delay)await new Promise(resolve=>setTimeout(resolve,qa.delay));
 if(qa.fail)return new Response('test failure',{status:500});
 const path=request.operation==='secret_create'?'/tmp/lazycat-webshell-secret-'+crypto.randomUUID().replaceAll('-','')+'/key-'+crypto.randomUUID().replaceAll('-',''):request.metadata.path;
 return Response.json({path,name:path.split('/').at(-1)});
};
const manager=createSecretFileController({activePane:()=>qa.pane,generation:()=>qa.generation,canWrite:()=>!qa.readonly,prepare:()=>{},paste:(pane,text)=>{qa.pastes.push({selector:pane.selector,text});document.querySelector('#terminal-input').textContent+=text;return true;},focus:()=>{},shortcut:()=>qa.shortcut,setShortcut:value=>qa.shortcut=value,tr:(k,v)=>translate('zh-CN',k,v),status:message=>document.querySelector('#notice').textContent=message});
qa.manager=manager;document.querySelector('#open').onclick=()=>manager.open();
document.addEventListener('keydown',event=>{qa.keys??=[];qa.keys.push({code:event.code,key:event.key,owned:manager.ownsEvent(event),target:event.target.tagName,open:Boolean(document.querySelector('dialog[open]'))});if(manager.ownsEvent(event)){event.stopImmediatePropagation();return;}manager.handleShortcut(event,qa.pane);},true);
document.querySelector('#mobile-host').innerHTML=renderMobileKeyboardView();
const mobile=createMobileKeyboardController({root:document.querySelector('#mobileShortcuts'),preserveSystemKeyboardState:()=>()=>qa.restoredKeyboard++,onKeyInput:()=>{},onPasteShortcut:async()=>{},onAction:async action=>{if(action==='secret-file')manager.open();},onPhrase:async()=>{}});mobile.bind();
for(const node of document.querySelectorAll('[data-i18n-aria]'))node.setAttribute('aria-label',translate('zh-CN',node.dataset.i18nAria));
const terminal=createPaneTerminal({cols:80,rows:10,fontSize:14,fontLigatures:false,fontHinting:true,fontHintTarget:'normal',fonts:[{url:'/fonts/preinstalled/FiraCode-Regular.ttf',name:'Fira Code'}],scrollbackLimit:1000,touchSelectionMode:'long-press',transport:undefined,beforeInput:({text})=>text,contextMenuItems:()=>nativePaneContextMenuItems({pane:qa.pane,tab:{panes:[qa.pane]},visiblePaneCount:()=>1,translate:key=>translate('zh-CN',key),runAction:action=>{qa.lastMenuAction=action;if(action==='secret-file')manager.open(qa.pane);}}),searchClearButtonText:'Clear',searchPlaceholder:'Search',onDomReady:()=>{},onGridSize:()=>{}});
qa.pane.term=terminal;
const mount=createTerminalPaneMount('p','Test terminal',{onPointerDownCapture:event=>interceptTerminalContextMenuPointer(qa.pane,event),onPointerDown:()=>{},onPointerUpCapture:event=>interceptTerminalContextMenuPointer(qa.pane,event),onDoubleClick:()=>{},onContextMenu:event=>forwardPaneContextMenuToRestty(qa.pane,event,()=>{}),onMouseUp:()=>{},onTouchEnd:()=>{}});
mount.style.height='180px';document.querySelector('#terminal-mount').append(mount);terminal.open(mount);
const container=terminal.restty.getActivePane().container;container.id='qa-terminal-pane';
document.addEventListener('contextmenu',event=>{qa.contextEvents??=[];qa.contextEvents.push({target:event.target.tagName,id:event.target.id,prevented:event.defaultPrevented});},true);createIcons({icons});qa.ready=true;
</script></body></html>
