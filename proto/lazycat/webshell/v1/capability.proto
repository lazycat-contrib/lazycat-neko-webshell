edition = "2023";

package lazycat.webshell.v1;

// CapabilityService is the generic control plane for WebShell providers.
// It intentionally models abstract capabilities and plugin invocations, not
// concrete tools such as file transfer implementations, SSH clients, or AI
// providers. Tool-specific behavior belongs in descriptors and opaque payloads.
service CapabilityService {
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc GetProvider(GetProviderRequest) returns (GetProviderResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  rpc ConfigurePlugin(ConfigurePluginRequest) returns (ConfigurePluginResponse);
  rpc InvokePlugin(InvokePluginRequest) returns (InvokePluginResponse);
  rpc RequestControl(RequestControlRequest) returns (RequestControlResponse);
  rpc ReleaseControl(ReleaseControlRequest) returns (ReleaseControlResponse);
}

message ListInstancesRequest {}

message ListInstancesResponse {
  repeated Instance instances = 1;
}

message Instance {
  string selector = 1;
  string name = 2;
  string owner_deploy_id = 3;
  string status = 4;
}

message GetProviderRequest {}

message GetProviderResponse {
  ProviderDescriptor provider = 1;
}

message ProviderDescriptor {
  string id = 1;
  string display_name = 2;
  string version = 3;
  repeated Capability capabilities = 4;
}

message Capability {
  string id = 1;
  string kind = 2;
  string display_name = 3;
  string description = 4;
  repeated string transports = 5;
  string schema_json = 6;
}

message CreateSessionRequest {
  string selector = 1;
  int32 cols = 2;
  int32 rows = 3;
  map<string, string> metadata = 4;
}

message CreateSessionResponse {
  Session session = 1;
}

message Session {
  string id = 1;
  string selector = 2;
  string status = 3;
  int32 cols = 4;
  int32 rows = 5;
  ControlLease control = 6;
  map<string, string> metadata = 7;
}

message CloseSessionRequest {
  string session_id = 1;
  string selector = 2;
}

message CloseSessionResponse {
  string session_id = 1;
  string status = 2;
}

message ListSessionsRequest {
  string selector = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated PluginDescriptor plugins = 1;
}

message PluginDescriptor {
  string id = 1;
  string kind = 2;
  string display_name = 3;
  string description = 4;
  repeated string scopes = 5;
  repeated string accepted_content_types = 6;
  repeated string produced_content_types = 7;
  string input_schema_json = 8;
  string output_schema_json = 9;
  bool enabled = 10;
  map<string, string> metadata = 11;
}

message ConfigurePluginRequest {
  string plugin_id = 1;
  bool enabled = 2;
  map<string, string> metadata = 3;
}

message ConfigurePluginResponse {
  PluginDescriptor plugin = 1;
}

message InvokePluginRequest {
  string plugin_id = 1;
  string session_id = 2;
  string operation = 3;
  string content_type = 4;
  bytes payload = 5;
  map<string, string> metadata = 6;
}

message InvokePluginResponse {
  string invocation_id = 1;
  string status = 2;
  string content_type = 3;
  bytes payload = 4;
  map<string, string> metadata = 5;
}

message RequestControlRequest {
  string session_id = 1;
  string actor_id = 2;
  string actor_kind = 3;
  string reason = 4;
}

message RequestControlResponse {
  ControlLease lease = 1;
}

message ReleaseControlRequest {
  string session_id = 1;
  string lease_id = 2;
}

message ReleaseControlResponse {
  string session_id = 1;
  string status = 2;
}

message ControlLease {
  string lease_id = 1;
  string actor_id = 2;
  string actor_kind = 3;
  string status = 4;
}

// AgentProtocol is used only between the provider process and the
// instance-local persistent WebShell agent. The browser-facing WebSocket keeps
// its existing binary-output/text-control protocol.

message AgentRequest {
  AgentRequestType type = 1;
  string selector = 2;
  string username = 3;
  string pane_id = 4;
  int32 cols = 5;
  int32 rows = 6;
  int32 output_limit = 7;
  AgentWorkspaceAction action = 8;
  int64 replay_after = 9;
  string session_id = 10;
}

enum AgentRequestType {
  AGENT_REQUEST_TYPE_UNSPECIFIED = 0;
  AGENT_REQUEST_TYPE_PING = 1;
  AGENT_REQUEST_TYPE_STATE = 2;
  AGENT_REQUEST_TYPE_ACTION = 3;
  AGENT_REQUEST_TYPE_ATTACH = 4;
  AGENT_REQUEST_TYPE_CLOSE_SESSION = 5;
}

message AgentResponse {
  bool ok = 1;
  string version = 2;
  string error = 3;
  AgentWorkspaceState state = 4;
}

message AgentWorkspaceState {
  string selector = 1;
  string active_tab_id = 2;
  repeated AgentTabState tabs = 3;
}

message AgentTabState {
  string id = 1;
  string label = 2;
  string custom_label = 3;
  string active_pane_id = 4;
  AgentLayoutNode layout = 5;
  repeated AgentPaneState panes = 6;
}

message AgentPaneState {
  string id = 1;
  string session_id = 2;
  string status = 3;
  string session_backend = 4;
  int32 cols = 5;
  int32 rows = 6;
}

message AgentLayoutNode {
  AgentLayoutNodeType type = 1;
  string pane_id = 2;
  AgentSplitAxis axis = 3;
  repeated AgentLayoutNode children = 4;
}

enum AgentLayoutNodeType {
  AGENT_LAYOUT_NODE_TYPE_UNSPECIFIED = 0;
  AGENT_LAYOUT_NODE_TYPE_PANE = 1;
  AGENT_LAYOUT_NODE_TYPE_SPLIT = 2;
}

enum AgentSplitAxis {
  AGENT_SPLIT_AXIS_UNSPECIFIED = 0;
  AGENT_SPLIT_AXIS_ROWS = 1;
  AGENT_SPLIT_AXIS_COLUMNS = 2;
}

message AgentWorkspaceAction {
  AgentWorkspaceActionType action = 1;
  string tab_id = 2;
  string pane_id = 3;
  AgentSplitDirection direction = 4;
  string label = 5;
  AgentLayoutNode layout = 6;
  string active_pane_id = 7;
}

enum AgentWorkspaceActionType {
  AGENT_WORKSPACE_ACTION_TYPE_UNSPECIFIED = 0;
  AGENT_WORKSPACE_ACTION_TYPE_CREATE_TAB = 1;
  AGENT_WORKSPACE_ACTION_TYPE_CLOSE_TAB = 2;
  AGENT_WORKSPACE_ACTION_TYPE_RENAME_TAB = 3;
  AGENT_WORKSPACE_ACTION_TYPE_ACTIVATE_TAB = 4;
  AGENT_WORKSPACE_ACTION_TYPE_SPLIT_PANE = 5;
  AGENT_WORKSPACE_ACTION_TYPE_CLOSE_PANE = 6;
  AGENT_WORKSPACE_ACTION_TYPE_ACTIVATE_PANE = 7;
  AGENT_WORKSPACE_ACTION_TYPE_PROMOTE_PANE_TO_TAB = 8;
  AGENT_WORKSPACE_ACTION_TYPE_UPDATE_LAYOUT = 9;
}

enum AgentSplitDirection {
  AGENT_SPLIT_DIRECTION_UNSPECIFIED = 0;
  AGENT_SPLIT_DIRECTION_UP = 1;
  AGENT_SPLIT_DIRECTION_DOWN = 2;
  AGENT_SPLIT_DIRECTION_LEFT = 3;
  AGENT_SPLIT_DIRECTION_RIGHT = 4;
}

message AgentFrame {
  AgentFrameType type = 1;
  bytes payload = 2;
  AgentControl control = 3;
  AgentResize resize = 4;
  int64 sequence = 5;
}

enum AgentFrameType {
  AGENT_FRAME_TYPE_UNSPECIFIED = 0;
  AGENT_FRAME_TYPE_BINARY = 1;
  AGENT_FRAME_TYPE_TEXT = 2;
  AGENT_FRAME_TYPE_INPUT = 3;
  AGENT_FRAME_TYPE_RESIZE = 4;
  AGENT_FRAME_TYPE_DETACH = 5;
}

message AgentControl {
  AgentControlType type = 1;
  string session_id = 2;
  string selector = 3;
  string pane_id = 4;
  int64 replay_after = 5;
  int64 last_sequence = 6;
  int32 exit_code = 7;
  string message = 8;
  bool history_recording = 9;
}

enum AgentControlType {
  AGENT_CONTROL_TYPE_UNSPECIFIED = 0;
  AGENT_CONTROL_TYPE_REPLAY_START = 1;
  AGENT_CONTROL_TYPE_REPLAY_COMPLETE = 2;
  AGENT_CONTROL_TYPE_PROCESS_EXIT = 3;
  AGENT_CONTROL_TYPE_HISTORY_RECORDING = 4;
}

message AgentResize {
  int32 cols = 1;
  int32 rows = 2;
}
