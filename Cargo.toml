[package]
name = "lazycat-neko-webshell"
version = "0.5.32"
edition = "2024"
rust-version = "1.88"
default-run = "lazycat-neko-webshell"

[dependencies]
anyhow = "1.0.100"
async-openai = { version = "0.41.1", default-features = false, features = ["audio", "byot", "chat-completion", "model", "responses", "rustls"] }
axum = { version = "0.8.7", features = ["tokio", "http1", "json", "multipart", "ws"] }
buffa = { version = "0.5.2", features = ["json"] }
buffa-types = "0.5.2"
bytes = "1.11.0"
capnp = "0.19.1"
capnp-futures = "0.19.0"
capnp-rpc = "0.19.0"
claude-sdk = { version = "2.1.0", default-features = false, features = ["anthropic"] }
connectrpc = { version = "0.4.2", features = ["axum"] }
futures = "0.3.31"
http = "1.4.0"
http-body = "1.0.1"
lzc-sdk = { version = "0.1.1", default-features = false, features = ["gateway"] }
mime_guess = "2.0.5"
ngrok = "0.18.0"
portable-pty = "0.9.0"
quinn = { version = "0.10.2", features = ["futures-io"] }
base64 = "0.22.1"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
reqwest13 = { package = "reqwest", version = "0.13.4", default-features = false }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
rustls = "0.21.12"
rustls23 = { package = "rustls", version = "0.23.41", default-features = false, features = ["ring", "std"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.13", features = ["io"] }
tower-http = { version = "0.6.6", features = ["trace", "cors", "fs", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }
wuff = "0.2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
connectrpc-build = "0.4.2"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
